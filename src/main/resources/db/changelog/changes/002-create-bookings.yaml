databaseChangeLog:
  - changeSet:
      id: 002-create-bookings
      author: meeting-scheduler
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_room
                    references: rooms(id)
              - column:
                  name: person_in_charge
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE bookings
                ADD CONSTRAINT ck_bookings_time_range CHECK (end_time > start_time),
                ADD CONSTRAINT ck_bookings_status CHECK (status IN ('ACTIVE', 'CANCELLED'))
        - createIndex:
            tableName: bookings
            indexName: ix_bookings_room_start
            columns:
              - column:
                  name: room_id
              - column:
                  name: start_time
        - createIndex:
            tableName: bookings
            indexName: ix_bookings_start
            columns:
              - column:
                  name: start_time
      rollback:
        - dropTable:
            tableName: bookings
