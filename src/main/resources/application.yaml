spring:
  application:
    name: meeting-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meeting_scheduler}
    username: ${DB_USERNAME:meeting}
    password: ${DB_PASSWORD:meeting}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
