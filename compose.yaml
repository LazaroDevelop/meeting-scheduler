services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meeting_scheduler
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: meeting-scheduler:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/meeting_scheduler
      DB_USERNAME: meeting
      DB_PASSWORD: meeting
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
